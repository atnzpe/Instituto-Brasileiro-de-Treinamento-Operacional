# Automated tests of the delivery flow (README, "Fluxo de trabalho"):
# every push runs lint, unit tests and the production build.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Read-only token: this job only checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to a full commit SHA (not just a tag) so a moved or
      # compromised tag can't change what runs here.
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Instalar dependências (exatamente as do bun.lock)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build de produção (checagem de tipos + Vite)
        run: bun run build
