# Automatic deploy of the staging site (homolog.ib-to.org) — issue #26.
# HostGator plan P has no SSH, so dist/ goes over FTPS (FTP with TLS, the
# server certificate verified) using an FTP account locked to the staging
# folder. Production (public_html still holds the old site) is not deployed
# from here; switching it over will have its own issue and manual approval.
# Setup steps for the team: docs/deploy-homologacao.md, "Deploy automático".
name: Deploy homologação

on:
  # Every merge into main publishes staging.
  push:
    branches: [main]
  # Actions → "Deploy homologação" → Run workflow → pick the branch to test.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through an upload.
concurrency:
  group: deploy-homologacao
  cancel-in-progress: false

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Instalar dependências (exatamente as do bun.lock)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build de produção
        run: bun run build

      - name: Conferir o pacote (sem segredos, com o .htaccess)
        run: |
          test ! -e dist/config.php || { echo "dist/config.php não pode ser publicado"; exit 1; }
          for f in .htaccess index.html mensagem.php; do
            test -f "dist/$f" || { echo "Falta dist/$f"; exit 1; }
          done

      # include-hidden-files: without it the .htaccess (password, HTTPS,
      # config.php block) would be silently left out.
      - name: Guardar o site gerado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Enviar para homolog.ib-to.org
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # FTP secrets live in this environment only, so they never reach the
    # build job (where dependencies run their own code).
    environment:
      name: homologacao
      url: https://homolog.ib-to.org
    steps:
      - name: Pegar o site gerado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist/

      # Only uploads what changed. config.php (optional overrides, created by
      # hand on the server) is excluded, so it is never overwritten or deleted.
      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: dist/
          server-dir: ./
          exclude: |
            **/config.php

      # Desde 17/10/2026 (piloto) a homologação não tem mais a janelinha de senha:
      # confere que o site responde e que continua fora do Google (noindex).
      - name: Conferir que o site está no ar e fora do Google
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://homolog.ib-to.org/)
          echo "https://homolog.ib-to.org/ respondeu $code"
          test "$code" = "200" || { echo "Esperado 200 (site no ar)"; exit 1; }
          curl -s -I https://homolog.ib-to.org/ | grep -i '^x-robots-tag:.*noindex' || { echo "Esperado o cabeçalho X-Robots-Tag: noindex"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://homolog.ib-to.org/)
          echo "http://homolog.ib-to.org/ respondeu $code"
          test "$code" = "301" || { echo "Esperado 301 para HTTPS, sem pedir senha"; exit 1; }
