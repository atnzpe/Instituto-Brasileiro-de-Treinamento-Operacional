<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/webp" href="/images/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Per-page title/description/OG are set by each route's `head()`
         (see src/routes/*.tsx) via TanStack Router's <HeadContent/>, so they
         reflect the actual page instead of one generic string everywhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ib-to.org/images/hero.webp" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ib-to.org/images/hero.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Aleo:ital@0;1&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Instituto Brasileiro de Treinamento Operacional</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras (gov.br): Brazilian Sign Language (Libras) translation widget.
         Official embed snippet from https://vlibras.gov.br/ — kept as plain
         markup/script rather than React components since it manages its own
         DOM outside the app tree. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app')
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
